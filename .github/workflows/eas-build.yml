# Starts a build on EAS and finishes as soon as it is queued (--no-wait).
# Follow the build itself on expo.dev.
#
# The production profile also submits to the stores (--auto-submit). That needs
# the submit keys stored on EAS: a Google Service Account Key for Android and an
# App Store Connect API Key for iOS (see `eas credentials`).
name: EAS Build

on:
  workflow_call:
    inputs:
      profile:
        description: "EAS build profile"
        type: string
        required: false
        default: "preview"
      platform:
        description: "Platform to build for"
        type: string
        required: false
        default: "all"
      clear_cache:
        description: "Clear build cache"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options:
          - development
          - preview
          - production
        default: "preview"
      platform:
        description: "Platform to build for"
        type: choice
        options:
          - all
          - android
          - ios
        default: "all"
      clear_cache:
        description: "Clear build cache"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mensasverige
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: mensasverige/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          CLEAR_CACHE: ${{ inputs.clear_cache }}
        run: |
          ARGS=(--profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait)
          if [[ "$CLEAR_CACHE" == "true" ]]; then
            ARGS+=(--clear-cache)
          fi
          if [[ "$PROFILE" == "production" ]]; then
            ARGS+=(--auto-submit)
          fi

          echo "Running: eas build ${ARGS[*]}"
          eas build "${ARGS[@]}"

      - name: Build Summary
        if: always()
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo "## EAS build queued"
            echo "- **Profile**: $PROFILE"
            echo "- **Platform**: $PLATFORM"
            echo "- **Commit**: $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "- Follow it at https://expo.dev/accounts/mensasverige/projects/mensasverige/builds"
          } >> "$GITHUB_STEP_SUMMARY"
