# Publishes an OTA update to the channel with the same name as the environment.
#
# runtimeVersion follows `version` in app.config.ts, so the update only reaches
# builds of exactly that version. JS that needs native code a build doesn't have
# will crash it, so bump `version` (and make a store build) with every native change.
name: EAS Update

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag for the update message"
        type: string
        required: false
      environment:
        description: "EAS update environment"
        type: string
        required: false
        default: "preview"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for the update message"
        type: string
        required: false
      environment:
        description: "EAS update environment"
        type: choice
        options:
          - preview
          - production
        default: "preview"

jobs:
  publish-eas-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mensasverige
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: mensasverige/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: ${{ inputs.environment }}
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            MESSAGE="Release $RELEASE_TAG"
          else
            MESSAGE="$(git log -1 --pretty=%s)"
          fi

          echo "Publishing update to $ENVIRONMENT: $MESSAGE"
          eas update --environment "$ENVIRONMENT" --channel "$ENVIRONMENT" --message "$MESSAGE" --non-interactive
